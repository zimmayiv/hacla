notes:
  - {holding: rosslyn-lofts, text: "Bought at a foreclosure sale by LOMOD South. Originally developed with LAHD and HCD covenants; substantially occupied by extremely low-income residents. Board action ratifies a May 19, 2026 closed-session authorization to cure any alleged Brown Act violation.", source: boc_rosslyn, quote: "CURE AND CORRECT ANY"}
  - {holding: clarendon-apartments, text: "Occupied market-rate building; covenants apply on turnover or voluntary certification, and no resident must move. Rent limited to 30% of gross income at the tier, with 4% annual increase cap. Covenant lasts until senior bonds are repaid, projected 37 years.", source: boc_clarendon, quote: "maximum of four"}
  - {holding: lafayette-park, text: "City loan is forgiven through a 20-year service payback; repayment clock starts at three years or when 90 units are occupied by households at or below 80% AMI.", source: audit_2024, quote: "It is structured with a 20-year service payback period"}
  - {holding: harbor-view-place, text: "Investor exited the partnership by Dec 2024, replaced by Abode. HACLA plans purchase and resyndication; RAD/Section 18 blend for 48 public housing units.", source: plan_2027, quote: "The investor exited the partnership by December 2024"}
  - {holding: wilmington-townhomes, text: "Investor exited by July 2025, replaced by Mercy Housing. Resyndication and RAD/Section 18 blend for 46 public housing units.", source: plan_2027, quote: "The investor exited the partnership by July 2025"}
  - {holding: william-mead-homes, text: "Proposed 17.9-acre redevelopment, up to three times the existing units (up to 1,600), up to 456 Restore Rebuild vouchers; Section 18 sequenced blend planned.", source: plan_2027, quote: "HACLA is proposing to utilize up to 456 Restore Rebuild vouchers"}
  - {holding: rancho-san-pedro, text: "One San Pedro: 478 homes to up to 1,600 mixed-income homes, up to 299 Restore Rebuild units; disposition to a HACLA instrumentality under a Section 18 sequenced blend.", source: plan_2027, quote: "HACLA is proposing to utilize up to"}
  - {holding: jordan-downs-legacy, text: "Master developer team: The Michaels Organization and BRIDGE Housing (2012). One-for-one replacement of 700 units with up to 1,800 new homes; 21-acre adjacent site purchased in 2008.", source: plan_2027, quote: "HACLA selected a Master Developer partner comprised of The Michaels"}
